[project]
name = "aurelius"
version = "0.1.0"
description = "Aurelius: single-user personal finance agent (brokerage layer)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Exact version is pinned by uv.lock. mcp 2.x moved its transport to httpx2.
    "mcp>=2.3,<2.4",
    # The only HTTP stack (decision 2026-11-09): MCP transport, token endpoint, discovery, DCR.
    # On Linux it trusts only the OS CA store (no certifi), so the image needs ca-certificates.
    "httpx2>=2.16,<3",
    "cryptography>=43",
    "pydantic>=2.9,<3",
]

[project.scripts]
aurelius = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits real Questrade (read-only); skipped unless AURELIUS_LIVE_TESTS=1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["T201", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
